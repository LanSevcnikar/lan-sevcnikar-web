<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Euler capital allocation before and after reinsurance</title><desc id="desc">Stacked bars show total capital decreasing from 152.7 before reinsurance to 117.9 for the optimal cover and 119.1 for the realistic cover.</desc>
  <rect width="960" height="500" fill="#11151c"/><text x="75" y="62" fill="#f3f1eb" font-family="Arial, sans-serif" font-size="28" font-weight="700">Where the capital sits</text><text x="75" y="92" fill="#aeb7c4" font-family="Arial, sans-serif" font-size="16">Euler allocation by risk — the heavy-tailed risks X and Y dominate</text>
  <g stroke="#3b4350"><path d="M110 410H880M110 305H880M110 200H880M110 95H880"/></g><g fill="#aeb7c4" font-family="Arial, sans-serif" font-size="14" text-anchor="end"><text x="98" y="415">0</text><text x="98" y="310">50</text><text x="98" y="205">100</text><text x="98" y="100">150</text></g>
  <g><rect x="220" y="330.5" width="130" height="79.5" fill="#7c8da3"/><rect x="220" y="294.6" width="130" height="35.9" fill="#a7b4c5"/><rect x="220" y="124.2" width="130" height="170.4" fill="#ff6525"/><rect x="220" y="43.8" width="130" height="80.4" fill="#e2481c"/>
  <rect x="435" y="342.6" width="130" height="67.4" fill="#7c8da3"/><rect x="435" y="311.1" width="130" height="31.5" fill="#a7b4c5"/><rect x="435" y="177.5" width="130" height="133.6" fill="#ff6525"/><rect x="435" y="110.7" width="130" height="66.8" fill="#e2481c"/>
  <rect x="650" y="332.5" width="130" height="77.5" fill="#7c8da3"/><rect x="650" y="291.8" width="130" height="40.7" fill="#a7b4c5"/><rect x="650" y="163.1" width="130" height="128.7" fill="#ff6525"/><rect x="650" y="35.2" width="130" height="127.9" fill="#e2481c"/></g>
  <g fill="#f3f1eb" font-family="Arial, sans-serif" font-size="16" text-anchor="middle"><text x="285" y="440">Gross</text><text x="500" y="440">Optimal cover</text><text x="715" y="440">Realistic cover</text></g><g font-family="Arial, sans-serif" font-size="15"><rect x="260" y="470" width="14" height="14" fill="#7c8da3"/><text x="280" y="482" fill="#f3f1eb">U</text><rect x="330" y="470" width="14" height="14" fill="#a7b4c5"/><text x="350" y="482" fill="#f3f1eb">V</text><rect x="400" y="470" width="14" height="14" fill="#ff6525"/><text x="420" y="482" fill="#f3f1eb">X</text><rect x="470" y="470" width="14" height="14" fill="#e2481c"/><text x="490" y="482" fill="#f3f1eb">Y</text></g>
